# Copia de seguridad diaria de la base. El plan gratuito de MongoDB Atlas (M0) no incluye
# backups automáticos, así que se hace un mongodump y se sube al mismo bucket de R2 que las fotos.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   BACKUP_MONGO_URI      usuario de Atlas con rol de solo lectura
#   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#
# Para borrar copias viejas: en R2, regla de ciclo de vida sobre el prefijo "backups/" (ej. 90 días).
name: Backup diario

on:
  schedule:
    - cron: "0 7 * * *" # 4:00 en Argentina
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.tgz -o tools.tgz
          tar -xzf tools.tgz
          echo "$PWD/$(ls -d mongodb-database-tools-*/)bin" >> "$GITHUB_PATH"

      - name: mongodump
        env:
          MONGO_URI: ${{ secrets.BACKUP_MONGO_URI }}
        run: mongodump --uri "$MONGO_URI" --archive=backup.gz --gzip

      - name: Subir a R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp backup.gz "s3://${{ secrets.S3_BUCKET }}/backups/nueva-vida-$(date -u +%Y-%m-%d).gz" \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}"
