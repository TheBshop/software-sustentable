name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-y-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de la API (MongoDB en memoria)
        run: npm test
      - name: Build de la web
        run: npm run build:web
